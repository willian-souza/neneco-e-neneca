<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050b18" />
  <title>Neneco & Neneca</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div id="rotateNotice" class="rotate-notice" aria-hidden="true">
    <div class="rotate-card">
      <div class="rotate-icon">📱↻</div>
      <strong>VIRE O CELULAR</strong>
      <p>Para uma experiência melhor, jogue na horizontal.</p>
    </div>
  </div>
  <main id="game" aria-label="Neneco e Neneca">
    <section id="menu" class="screen menu active">
      <div class="menu-card">
        <span class="eyebrow">UMA HISTÓRIA EM PIXELS</span>
        <h1>NENECO <i>&</i> NENECA</h1>
        <p>Algumas histórias começam antes da primeira conversa.</p>
        <button id="startBtn" class="primary">COMEÇAR</button>
      </div>
    </section>

    <section id="story" class="screen story" tabindex="0">
      <div class="stage">
        <div class="chapter-hud">
          <span id="chapterLabel">PRÓLOGO</span>
          <strong id="chapterTitle">ADAMANTINA</strong>
          <small id="chapterSubtitle">DE ONDE TUDO COMEÇOU...</small>
        </div>
        <div class="art-frame">
          <img id="sceneArt" alt="Cena da história" draggable="false" />
          <div class="vignette"></div>
        </div>
        <div class="narration" aria-live="polite">
          <p id="narrationText"></p>
          <span class="next">▼</span>
        </div>
        <button id="backBtn" class="back-scene" type="button" aria-label="Voltar uma cena" title="Voltar uma cena" hidden>◀ VOLTAR</button>
        <div class="progress"><span id="progressBar"></span></div>
        <span class="tap">TOQUE PARA CONTINUAR</span>
      </div>
    </section>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
